<style>
:root{--bg:#f6f7fb;--card:#fff;--ink:#1f2430;--muted:#6b7280;--line:#e5e7eb;--brand:#4f46e5;--brand2:#7c6cf0;--ok:#0a7d43;--err:#c62828}
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,"PingFang SC","Microsoft YaHei","Noto Sans SC",sans-serif;background:var(--bg);color:var(--ink)}
header{background:linear-gradient(120deg,var(--brand),var(--brand2));color:#fff;padding:30px 20px 24px;text-align:center}

.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px 20px;margin-bottom:16px}
label{display:block;font-size:13px;color:var(--muted);margin:0 0 8px}
textarea{width:100%;min-height:120px;padding:12px;border:1px solid var(--line);border-radius:10px;font-size:14px;font-family:ui-monospace,Menlo,Consolas,monospace;resize:vertical}
textarea:focus{outline:2px solid var(--brand);outline-offset:-1px}

.item .code{font-size:30px;font-weight:700;letter-spacing:3px;font-family:ui-monospace,Menlo,Consolas,monospace;cursor:pointer;line-height:1.15}
.item .code:hover{color:var(--brand)}

.ring{width:44px;height:44px;flex:none;position:relative}
.ring svg{transform:rotate(-90deg)}

.empty{color:var(--muted);text-align:center;padding:22px 0;font-size:14px}
footer{text-align:center;color:var(--muted);font-size:13px;padding:0 16px 30px}

<body>
<header>
  <h1>🔐 2FA 验证码</h1>
  <p>粘贴密钥，立即出码 · <a href="/">← 回小工具箱</a></p>
</header>
<div class="wrap">
  <div class="card">
    <label for="keys">把密钥粘贴到这里（每行一个，可批量）</label>
    <textarea id="keys" placeholder="JBSWY3DPEHPK3PXP
也可以粘贴 otpauth:// 链接
也可以整行粘贴账号信息，例如 账号----密码----密钥，自动提取密钥"></textarea>
    <div class="hint">支持：纯 Base32 密钥 / otpauth:// 链接 / 账号----密码----2FA----RT 整行粘贴（自动拆分，四段都能一键复制）。<br>所有计算都在你的浏览器本地完成，<b>不保存、不上传</b>，刷新页面即清空。</div>
    <button class="btn ghost" onclick="document.getElementById('qrFile').click()">📷 上传二维码图片添加</button>
    <input type="file" id="qrFile" accept="image/*" style="display:none">
    <button class="btn ghost" onclick="clearAll()">清空</button>
    <div class="msg" id="msg"></div>
  </div>
  <div id="list"></div>
  <div class="empty" id="emptyTip">粘贴密钥后，验证码会立刻显示在这里</div>
</div>
<footer>2FA 验证码 · xin8.qd.je ｜ 验证码点一下即可复制</footer>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jsQR/1.4.0/jsQR.min.js"></script>
<script>
var entries=[];
function setMsg(t,ok){var m=document.getElementById('msg');m.textContent=t;m.className='msg '+(ok?'ok':'err');}
function b32decode(s){
  var alphabet='ABCDEFGHIJKLMNOPQRSTUVWXYZ234567';
  s=(s||'').toUpperCase().replace(/[\s=-]/g,'');
  var bits=0,val=0,out=[];
  for(var i=0;i<s.length;i++){
    var idx=alphabet.indexOf(s[i]);
    if(idx<0)throw new Error('bad char');
    val=(val<<5)|idx;bits+=5;
    if(bits>=8){out.push((val>>>(bits-8))&0xff);bits-=8;}
  }
  if(!out.length)throw new Error('empty');
  return new Uint8Array(out);
}
/* ---- pure JS SHA-1 / SHA-256 (works on plain HTTP too) ---- */
function rotl(x,n){return (x<<n)|(x>>>(32-n));}
function rotr(x,n){return (x>>>(n))|(x<<(32-n));}
function padMsg(bytes){
  var ml=bytes.length;
  var total=Math.floor((ml+9+63)/64)*64;
  var buf=new Uint8Array(total);
  buf.set(bytes);buf[ml]=0x80;
  var dv=new DataView(buf.buffer);
  dv.setUint32(total-4,(ml*8)>>>0);
  dv.setUint32(total-8,Math.floor(ml/536870912));
  return buf;
}
function sha1(bytes){
  var buf=padMsg(bytes);
  var h0=0x67452301,h1=0xefcdab89,h2=0x98badcfe,h3=0x10325476,h4=0xc3d2e1f0;
  var w=new Int32Array(80);
  for(var b=0;b<buf.length;b+=64){
    var dv=new DataView(buf.buffer,b,64);
    for(var i=0;i<16;i++)w[i]=dv.getInt32(i*4);
    for(i=16;i<80;i++)w[i]=rotl(w[i-3]^w[i-8]^w[i-14]^w[i-16],1);
    var a=h0,bb=h1,c=h2,d=h3,e=h4;
    for(i=0;i<80;i++){
      var f,k;
      if(i<20){f=(bb&c)|(~bb&d);k=0x5a827999;}
      else if(i<40){f=bb^c^d;k=0x6ed9eba1;}
      else if(i<60){f=(bb&c)|(bb&d)|(c&d);k=0x8f1bbcdc;}
      else{f=bb^c^d;k=0xca62c1d6;}
      var tmp=(rotl(a,5)+f+e+k+w[i])|0;
      e=d;d=c;c=rotl(bb,30);bb=a;a=tmp;
    }
    h0=(h0+a)|0;h1=(h1+bb)|0;h2=(h2+c)|0;h3=(h3+d)|0;h4=(h4+e)|0;
  }
  var out=new Uint8Array(20);var odv=new DataView(out.buffer);
  odv.setInt32(0,h0);odv.setInt32(4,h1);odv.setInt32(8,h2);odv.setInt32(12,h3);odv.setInt32(16,h4);
  return out;
}
var SHA256_K=null,SHA256_H=null;
function sha256Init(){
  var primes=[],n=2;
  while(primes.length<64){
    var isP=true;
    for(var i=2;i*i<=n;i++)if(n%i===0){isP=false;break;}
    if(isP)primes.push(n);
    n++;
  }
  function frac32(x){return Math.floor((x-Math.floor(x))*4294967296);}
  SHA256_K=primes.map(function(p){return frac32(Math.cbrt(p));});
  SHA256_H=primes.slice(0,8).map(function(p){return frac32(Math.sqrt(p));});
}
function sha256(bytes){
  if(!SHA256_K)sha256Init();
  var buf=padMsg(bytes);
  var h=SHA256_H.slice();
  var w=new Int32Array(64);
  for(var b=0;b<buf.length;b+=64){
    var dv=new DataView(buf.buffer,b,64);
    for(var i=0;i<16;i++)w[i]=dv.getInt32(i*4);
    for(i=16;i<64;i++){
      var s0=rotr(w[i-15],7)^rotr(w[i-15],18)^(w[i-15]>>>3);
      var s1=rotr(w[i-2],17)^rotr(w[i-2],19)^(w[i-2]>>>10);
      w[i]=(w[i-16]+s0+w[i-7]+s1)|0;
    }
    var a=h[0],bb=h[1],c=h[2],d=h[3],e=h[4],f=h[5],g=h[6],hh=h[7];
    for(i=0;i<64;i++){
      var S1=rotr(e,6)^rotr(e,11)^rotr(e,25);
      var ch=(e&f)^(~e&g);
      var t1=(hh+S1+ch+SHA256_K[i]+w[i])|0;
      var S0=rotr(a,2)^rotr(a,13)^rotr(a,22);
      var mj=(a&bb)^(a&c)^(bb&c);
      var t2=(S0+mj)|0;
      hh=g;g=f;f=e;e=(d+t1)|0;d=c;c=bb;bb=a;a=(t1+t2)|0;
    }
    h[0]=(h[0]+a)|0;h[1]=(h[1]+bb)|0;h[2]=(h[2]+c)|0;h[3]=(h[3]+d)|0;
    h[4]=(h[4]+e)|0;h[5]=(h[5]+f)|0;h[6]=(h[6]+g)|0;h[7]=(h[7]+hh)|0;
  }
  var out=new Uint8Array(32);var odv=new DataView(out.buffer);
  for(i=0;i<8;i++)odv.setInt32(i*4,h[i]);
  return out;
}
function hmac(hashFn,blockSize,key,msg){
  var k=key;
  if(k.length>blockSize)k=hashFn(k);
  var inner=new Uint8Array(blockSize+msg.length);
  var outerPad=new Uint8Array(blockSize);
  for(var i=0;i<blockSize;i++){
    var kb=i<k.length?k[i]:0;
    inner[i]=kb^0x36;outerPad[i]=kb^0x5c;
  }
  inner.set(msg,blockSize);
  var innerHash=hashFn(inner);
  var outer=new Uint8Array(blockSize+innerHash.length);
  outer.set(outerPad);outer.set(innerHash,blockSize);
  return hashFn(outer);
}
function totpCalc(a,counter){
  var keyBytes=b32decode(a.secret);
  var msg=new Uint8Array(8);
  var dv=new DataView(msg.buffer);
  dv.setUint32(4,counter>>>0);dv.setUint32(0,Math.floor(counter/4294967296));
  var sig;
  if(a.algo==='SHA-256')sig=hmac(sha256,64,keyBytes,msg);
  else if(a.algo==='SHA-512')throw new Error('SHA-512 需 HTTPS 环境');
  else sig=hmac(sha1,64,keyBytes,msg);
  var off=sig[sig.length-1]&0x0f;
  var bin=((sig[off]&0x7f)<<24)|((sig[off+1]&0xff)<<16)|((sig[off+2]&0xff)<<8)|(sig[off+3]&0xff);
  var code=String(bin%Math.pow(10,a.digits));
  while(code.length<a.digits)code='0'+code;
  return code;
}
/* ---- end crypto ---- */
function secretFromField(f){
  var c=(f||'').replace(/\s/g,'');
  if(!/^[A-Za-z2-7]{8,}$/.test(c))return null;
  try{b32decode(c);return c.toUpperCase();}catch(e){return null;}
}
function findSecret(line){
  if(/----|\||\t|,|;/.test(line)){
    var parts=line.split(/----|\||\t|,|;/);
    for(var i=parts.length-1;i>=0;i--){
      var s=secretFromField(parts[i]);
      if(s)return s;
    }
  }
  var t=line.trim();
  var groups=t.split(/\s+/);
  if(groups.length>1){
    var g4=groups.every(function(g,i){return /^[A-Za-z2-7]+$/.test(g)&&(g.length===4||(i===groups.length-1&&g.length>=1&&g.length<4));});
    var wholeG=t.replace(/\s/g,'');
    if(g4&&wholeG.length>=16){
      try{b32decode(wholeG);return wholeG.toUpperCase();}catch(e){}
    }
  }else if(/^[A-Za-z2-7]{16,}$/.test(t)){
    try{b32decode(t);return t.toUpperCase();}catch(e){}
  }
  var m=t.match(/[A-Za-z2-7]{16,}/g);
  if(!m)return null;
  m.sort(function(a,b){return b.length-a.length;});
  for(var j=0;j<m.length;j++){
    try{b32decode(m[j]);return m[j].toUpperCase();}catch(e){}
  }
  return null;
}
function parseOtpAuth(link){
  var u=new URL(link.trim());
  if(u.protocol!=='otpauth:'||u.hostname!=='totp')return null;
  var q=u.searchParams;
  var secret=q.get('secret');
  if(!secret)return null;
  var label=decodeURIComponent(u.pathname.replace(/^\//,''));
  var issuer=q.get('issuer')||'';
  var name=label;
  if(label.indexOf(':')>0){if(!issuer)issuer=label.split(':')[0];name=label.split(':').slice(1).join(':');}
  return {label:(issuer?issuer+' · ':'')+(name||'未命名'),name:name||'',secret:secret,
    digits:parseInt(q.get('digits')||'6',10),
    period:parseInt(q.get('period')||'30',10),
    algo:(q.get('algorithm')||'SHA1').replace('SHA1','SHA-1'),win:-1};
}
function labelFor(line,secret){
  var parts=line.split(/----|[\|\t,;]/);
  var first=(parts[0]||'').trim();
  if(first&&first.replace(/\s/g,'').toUpperCase()!==secret&&first.length<=40)return first;
  return '密钥 ····'+secret.slice(-4);
}
function copyText(t,btn){
  function done(){
    if(btn){var old=btn.textContent;btn.textContent='已复制 ✓';btn.classList.add('done');
      setTimeout(function(){btn.textContent=old;btn.classList.remove('done');},1200);}
  }
  if(navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(t).then(done,function(){fallback();});
  }else fallback();
  function fallback(){
    var ta=document.createElement('textarea');
    ta.value=t;ta.style.position='fixed';ta.style.opacity='0';
    document.body.appendChild(ta);ta.select();
    try{document.execCommand('copy');done();}catch(e){}
    document.body.removeChild(ta);
  }
}
function parseDelimited(line){
  var parts=line.split(/----|\||\t|,|;/).map(function(x){return x.trim();});
  if(parts.length<3)return null;
  var secret=null,secretIdx=-1;
  for(var i=2;i<parts.length;i++){
    var c=parts[i].replace(/\s/g,'');
    if(c.length<=64){var s=secretFromField(parts[i]);if(s){secret=s;secretIdx=i;break;}}
  }
  if(!secret){
    for(var j=parts.length-1;j>=2;j--){
      var c2=parts[j].replace(/\s/g,'');
      if(c2.length<=64){var s2=secretFromField(parts[j]);if(s2){secret=s2;secretIdx=j;break;}}
    }
  }
  if(!secret)return null;
  var rt=null;
  if(secretIdx>=0&&secretIdx<parts.length-1){
    var rest=parts.slice(secretIdx+1).join('----').trim();
    if(rest)rt=rest;
  }
  return {label:parts[0]||('密钥 ····'+secret.slice(-4)),account:parts[0]||null,
    password:parts[1]||null,secret:secret,rt:rt,digits:6,period:30,algo:'SHA-1',win:-1};
}
function parseAll(){
  var text=document.getElementById('keys').value;
  var lines=text.split(/\n/);
  var out=[],bad=0;
  for(var i=0;i<lines.length;i++){
    var line=lines[i].trim();
    if(!line)continue;
    if(line.indexOf('otpauth://')===0){
      var p=parseOtpAuth(line);
      if(p){p.account=p.name||null;p.password=null;p.rt=null;out.push(p);}else bad++;
      continue;
    }
    if(/----|\||\t|,|;/.test(line)){
      var d=parseDelimited(line);
      if(d){out.push(d);continue;}
    }
    var sec=findSecret(line);
    if(sec)out.push({label:labelFor(line,sec),account:null,password:null,secret:sec,rt:null,digits:6,period:30,algo:'SHA-1',win:-1});
    else bad++;
  }
  var old={};
  entries.forEach(function(e){old[e.secret+'|'+e.label]=e;});
  out.forEach(function(e){
    var k=e.secret+'|'+e.label;
    if(old[k])e.win=old[k].win;
  });
  entries=out;
  render();
  if(bad>0)setMsg('⚠️ 有 '+bad+' 行没识别出密钥，已跳过',0);
  else if(out.length)setMsg('✅ 已识别 '+out.length+' 条',1);
  else setMsg('',1);
}
function render(){
  var box=document.getElementById('list');
  document.getElementById('emptyTip').style.display=entries.length?'none':'block';
  box.innerHTML='';
  entries.forEach(function(e){
    var d=document.createElement('div');d.className='item';
    d.innerHTML='<div class="info"><div class="label"></div><div class="chips"></div><div class="code" title="点击复制验证码">------</div></div>'+
      '<div class="ring"><svg width="44" height="44"><circle cx="22" cy="22" r="19" fill="none" stroke="#eceef3" stroke-width="4"/>'+
      '<circle class="arc" cx="22" cy="22" r="19" fill="none" stroke="#4f46e5" stroke-width="4" stroke-linecap="round" stroke-dasharray="119.4" stroke-dashoffset="0"/></svg><div class="n"></div></div>';
    d.querySelector('.label').textContent=e.label;
    var chips=d.querySelector('.chips');
    function addChip(text,val){
      if(!val)return;
      var b=document.createElement('button');b.className='chip';b.textContent=text;
      b.addEventListener('click',function(){copyText(val,b);});
      chips.appendChild(b);
    }
    addChip('复制账号',e.account);
    addChip('复制密码',e.password);
    addChip('复制 RT',e.rt);
    var codeEl=d.querySelector('.code');
    codeEl.addEventListener('click',function(){
      var t=codeEl.textContent.replace(/\s/g,'');
      if(/^\d+$/.test(t))copyText(t,null);
    });
    e._codeEl=codeEl;e._arcEl=d.querySelector('.arc');e._nEl=d.querySelector('.n');
    box.appendChild(d);
  });
}
function tick(){
  var nowSec=Date.now()/1000;
  for(var i=0;i<entries.length;i++){
    var e=entries[i];
    if(!e._codeEl)continue;
    var win=Math.floor(nowSec/e.period);
    var remain=e.period-(Math.floor(nowSec)%e.period);
    if(e.win!==win){
      e.win=win;
      try{
        var c=totpCalc(e,win);
        e._codeEl.textContent=c.length>6?c.substr(0,Math.ceil(c.length/2))+' '+c.substr(Math.ceil(c.length/2)):c;
        e._codeEl.className='code';
      }catch(err){
        e._codeEl.textContent=err.message;
        e._codeEl.className='code bad';
      }
    }
    var frac=remain/e.period;
    e._arcEl.style.strokeDashoffset=String(119.4*(1-frac));
    e._arcEl.style.stroke=remain<=5?'#c62828':'#4f46e5';
    e._nEl.textContent=remain;
  }
}
var deb=null;
document.getElementById('keys').addEventListener('input',function(){
  if(deb)clearTimeout(deb);
  deb=setTimeout(parseAll,200);
});
function clearAll(){
  document.getElementById('keys').value='';
  entries=[];render();setMsg('',1);
}
document.getElementById('qrFile').addEventListener('change',function(){
  var f=this.files&&this.files[0];
  if(!f)return;
  var img=new Image();
  img.onload=function(){
    var cv=document.createElement('canvas');
    cv.width=img.width;cv.height=img.height;
    var ctx=cv.getContext('2d');ctx.drawImage(img,0,0);
    var data=ctx.getImageData(0,0,cv.width,cv.height);
    if(typeof jsQR==='undefined'){setMsg('❌ 二维码识别库加载失败，请检查网络',0);return;}
    var res=jsQR(data.data,cv.width,cv.height);
    if(res&&res.data){
      var ta=document.getElementById('keys');
      ta.value=(ta.value?ta.value.replace(/\n+$/,'')+'\n':'')+res.data+'\n';
      parseAll();
    }else setMsg('❌ 没识别到二维码',0);
    URL.revokeObjectURL(img.src);
  };
  img.src=URL.createObjectURL(f);
  this.value='';
});
render();
tick();
setInterval(tick,250);
</script>
