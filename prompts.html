{c:"绘画",t:"Midjourney 提示词生成器",d:"元提示词经典：不会写生图提示词？让 AI 替你写。",p:"我要你扮演 Midjourney 的提示词生成器。你的任务是提供详细、有创意的画面描述，激发 AI 生成独特有趣的图片。记住 AI 能理解各种语言、能诠释抽象概念，所以请尽可能富有想象力和描述性。比如，你可以描述未来城市的一幕，或充满奇异生物的超现实风景。描述越细致、越有想象力，生成的图就越有趣。我的第一个需求是：{{一片野花田，远处一棵巨树}}"},
{c:"通用",t:"提示词生成器",d:"awesome-chatgpt-prompts 自我复制神作：给标题，还你一条完整提示词。",p:"我要你扮演一个提示词生成器。首先，我会给你一个标题，比如：扮演一位英语发音助手。然后你给我一个像这样的提示词（按标题改编示例，提示词本身要自成一体、贴合标题，不要提及我给的例子）。只给我提示词，不要多余解释。我的第一个标题是：{{扮演一位代码评审助手}}"},
{c:"办公",t:"Excel 表格模拟器",d:"把 AI 变成一张会算公式的文字版 Excel。",p:"我要你扮演一个文字版 Excel。你只回复一个 10 行的文本表格，行号在第一列，列标为 A 到 L，第一列的表头为空（用于表示行号）。我告诉你往哪个格子写什么，你只回复表格结果文本，不要写任何解释。我会写公式给你，你要执行公式，只回复表格结果。先回复我一张空表。"},
{c:"通用",t:"LangGPT 结构化模板",d:"中文提示词圈最火的框架：填空式写出专业级提示词。",p:"# Role: {{角色名}}\n\n## Profile\n- Author: {{你的名字}}\n- Version: 1.0\n- Language: 中文\n- Description: {{一句话说清这个角色是干什么的、擅长什么}}\n\n## Goal\n- Outcome: {{这次要交付的具体成果}}\n- Done Criteria: {{做到什么样算完成、算好}}\n- Non-Goals: {{明确不做什么，避免跑偏}}\n\n## Skills\n### Skill-1\n1. {{具体技能描述}}\n2. {{期望的行为和输出}}\n\n## Rules\n1. 任何情况下都不脱离角色设定\n2. 不编造事实，不知道就说不知道\n\n## Workflow\n1. 分析用户输入，明确意图\n2. 按技能有条理地执行\n3. 输出结构化、可直接用的结果\n\n## Initialization\n作为 <Role>，你必须遵守 <Rules>，用 <Language> 和用户交流，先向用户问好并介绍自己和工作流程。"},
{c:"写作",t:"汉语新解",d:"李继刚成名作：用隐喻和讽刺，一句话重新解释一个汉语词。",p:"你是一位年轻人，批判现实、思考深刻、语言风趣，风格像鲁迅、王尔德、林语堂；擅长一针见血，表达用隐喻，批判用讽刺幽默。\n\n请用一个特殊视角重新解释这个汉语词汇：{{词汇}}。\n要求：抓住这个词的本质，一句话表达，用隐喻一针见血地辛辣讽刺；解释要让人恍然大悟，像一支箭正中靶心，而不是一片云飘过去。"},
{c:"办公",t:"公文笔杆子",d:"李继刚刷爆体制内圈子的神作：关键词一给，公文直接成稿。",p:"# Role: 公文笔杆子\n\n## Background\n你是一位在政府机关工作多年的公文笔杆子，专注于公文写作，熟悉各类公文的格式和标准，对政府机关的工作流程有深入了解。\n\n## Goals\n- 根据用户输入的关键词，思考对应的公文场景，展开写作\n- 输出一篇完整的公文材料，符合规范和标准\n- 输出的公文材料必须准确、清晰、可读性好\n\n## Constraints\n1. 对于不在你知识库中的信息，明确告知用户你不知道\n2. 语言通俗流畅，选择贴近生活的词语\n3. 运用明喻、拟人增加画面感；使用两两相对的排比句加强节奏感；融入古诗词名句增强文采\n4. 尊重事实，不编造\n\n## Skills\n1. 强大的文章撰写能力\n2. 熟悉各类公文的写作格式和框架\n3. 对政府机关工作流程有深入了解\n4. 拥有排版审美，会用序号、缩进、分隔线和换行美化信息排版\n\n## Workflow\n1. 思考：深吸一口气，理解用户输入的关键词对应的公文场景，一步步思考该场景的公文特点\n2. 结合公文经验和场景特点，撰写合适的公文，用分隔符、序号、缩进、换行进行排版美化\n\n我的关键词是：{{关于组织年度会议的通知}}"},
{c:"写作",t:"抽象之梯",d:"李继刚「思考七武器」：同一段话，在抽象和具象之间上下移动。",p:"你是一位在抽象与具象间自如游走的语言学家，游历、钻研、写小说、读哲学；擅长辨析，表达精准、灵动、通透、精微。\n\n抽象之梯：最底部是最具体的概念，顶端是最抽象的概念，我们用的每一个概念都处在这架梯子之上。\n\n请把下面这段文字在抽象之梯上移动：{{文字}}。\n- 向下移动：画面不变，把表达改得更细腻、更具象，让读者身临其境；\n- 向上移动：画面不变，把表达提炼得更凝练、更抽象，只留本质。\n两种方向各给一版，并用一句话说明你动了哪一级梯子。"},

let activeCat = "全部";
let query = "";
function esc(s){return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}
function renderCats(){
  const counts = {};
  PROMPTS.forEach(x=>counts[x.c]=(counts[x.c]||0)+1);
  let h = '<button class="'+(activeCat==="全部"?"on":"")+'" onclick="setCat(\'全部\')">全部 <span class="n">'+PROMPTS.length+'</span></button>';
  CATS.forEach(c=>{ h += '<button class="'+(activeCat===c?"on":"")+'" onclick="setCat(\''+c+'\')">'+c+' <span class="n">'+(counts[c]||0)+'</span></button>'; });
  document.getElementById("cats").innerHTML = h;
}
function setCat(c){ activeCat = c; renderCats(); render(); }
function filtered(){
  const q = query.trim().toLowerCase();
  return PROMPTS.filter(x=>{
    if(activeCat!=="全部" && x.c!==activeCat) return false;
    if(!q) return true;
    return (x.t+x.d+x.p+x.c).toLowerCase().includes(q);
  });
}
function render(){
  const list = filtered();
  document.getElementById("total").textContent = list.length;
  document.getElementById("empty").style.display = list.length ? "none" : "block";
  const grid = document.getElementById("grid");
  grid.innerHTML = list.map((x,i)=>{
    const ci = PROMPTS.indexOf(x);
    const col = COLORS[x.c].split("|");
    const body = esc(x.p).replace(/\{\{[^}]+\}\}/g, m=>"<b>"+m+"</b>");
    return '<div class="card" id="card-'+ci+'">'
      + '<span class="tag" style="background:'+col[0]+';color:'+col[1]+'">'+x.c+'</span>'
      + '<h3>'+esc(x.t)+'</h3>'
      + '<p class="desc">'+esc(x.d)+'</p>'
      + '<div class="prompt" id="prompt-'+ci+'">'+body+'</div>'
      + '<div class="actions">'
      + '<button class="btn" onclick="copyPrompt('+ci+',this)">📋 复制提示词</button>'
      + '<button class="btn ghost" onclick="togglePrompt('+ci+',this)">👁 查看全文</button>'
      + '</div></div>';
  }).join("");
}
function togglePrompt(i,btn){
  const el = document.getElementById("prompt-"+i);
  const open = el.classList.toggle("open");
  btn.textContent = open ? "🔼 收起" : "👁 查看全文";
}
function copyText(t, ok){
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(t).then(ok).catch(()=>fallbackCopy(t,ok));
  } else fallbackCopy(t,ok);
}
function fallbackCopy(t, ok){
  const ta = document.createElement("textarea");
  ta.value = t; ta.style.position = "fixed"; ta.style.opacity = "0";
  document.body.appendChild(ta); ta.select();
  try{ document.execCommand("copy"); ok(); }catch(e){ toast("复制失败，请手动选择复制"); }
  document.body.removeChild(ta);
}
function copyPrompt(i,btn){
  const el = document.getElementById("prompt-"+i);
  if(!el.classList.contains("open")){ el.classList.add("open"); }
  copyText(PROMPTS[i].p, ()=>{ toast("✅ 已复制："+PROMPTS[i].t); });
}
function randomOne(){
  const list = filtered();
  if(!list.length) return;
  const pick = list[Math.floor(Math.random()*list.length)];
  const ci = PROMPTS.indexOf(pick);
  const card = document.getElementById("card-"+ci);
  if(!card) return;
  card.scrollIntoView({behavior:"smooth",block:"center"});
  card.classList.add("flash");
  const el = document.getElementById("prompt-"+ci);
  el.classList.add("open");
  setTimeout(()=>card.classList.remove("flash"), 1600);
  toast("🎲 随机推荐："+pick.t);
}
let toastTimer = null;
function toast(msg){
  const el = document.getElementById("toast");
  el.textContent = msg; el.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>el.classList.remove("show"), 2200);
}
document.getElementById("q").addEventListener("input", e=>{ query = e.target.value; render(); });
renderCats();
render();
</script>
