<head>

<style>
:root{
  --bg:#f6f7fb; --card:#ffffff; --ink:#1f2430; --muted:#6b7280;
  --line:#e5e7eb; --brand:#4f46e5; --brand2:#7c6cf0; --ok:#0a7d43;
}
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,"PingFang SC","Microsoft YaHei","Noto Sans SC",sans-serif;background:var(--bg);color:var(--ink)}
header{background:linear-gradient(135deg,#4f46e5 0%,#7c6cf0 55%,#a855f7 100%);color:#fff;padding:40px 20px 34px;text-align:center;position:relative;overflow:hidden}
header::before{content:"";position:absolute;inset:0;background:radial-gradient(600px 200px at 20% -10%,rgba(255,255,255,.25),transparent 60%),radial-gradient(500px 180px at 85% 110%,rgba(255,255,255,.18),transparent 60%)}
header h1{margin:0 0 8px;font-size:30px;letter-spacing:1px;position:relative}
header p{margin:0 0 18px;opacity:.92;font-size:14px;position:relative}
.search{position:relative;max-width:560px;margin:0 auto}
.search input{width:100%;padding:13px 46px 13px 18px;border:0;border-radius:999px;font-size:15px;font-family:inherit;outline:none;box-shadow:0 6px 24px rgba(0,0,0,.18)}
.search input:focus{box-shadow:0 6px 24px rgba(0,0,0,.28)}
.search .ic{position:absolute;right:16px;top:50%;transform:translateY(-50%);font-size:17px;opacity:.55;pointer-events:none}
.wrap{max-width:1000px;margin:0 auto;padding:20px 16px 40px}
.stats{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin:2px 0 16px}
.stats .num{font-size:13px;color:var(--muted)}
.stats .num b{color:var(--brand);font-size:15px}
.btn{display:inline-block;background:var(--brand);color:#fff;border:0;padding:9px 16px;border-radius:999px;font-size:13px;cursor:pointer;font-family:inherit}
.btn:hover{opacity:.92}
.btn.ghost{background:#eef2ff;color:var(--brand)}
.cats{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 18px}
.cats button{border:1px solid var(--line);background:var(--card);color:var(--ink);padding:8px 14px;border-radius:999px;font-size:13px;cursor:pointer;font-family:inherit;transition:.15s}
.cats button:hover{border-color:var(--brand);color:var(--brand)}
.cats button.on{background:var(--brand);border-color:var(--brand);color:#fff}
.cats button .n{opacity:.65;font-size:12px;margin-left:2px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:720px){.grid{grid-template-columns:1fr}}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;display:flex;flex-direction:column;transition:.15s}
.card:hover{border-color:#c7c2f5;box-shadow:0 6px 20px rgba(79,70,229,.10)}
.card.flash{border-color:var(--brand);box-shadow:0 0 0 3px rgba(79,70,229,.18)}
.tag{align-self:flex-start;font-size:12px;font-weight:600;padding:3px 10px;border-radius:999px;margin-bottom:10px}
.card h3{margin:0 0 6px;font-size:16px;line-height:1.4}
.card .desc{color:var(--muted);font-size:13px;line-height:1.6;margin:0 0 12px}
.prompt{display:none;background:#f8fafc;border:1px dashed var(--line);border-radius:10px;padding:12px;font-size:13px;line-height:1.7;white-space:pre-wrap;word-break:break-word;margin:0 0 12px;font-family:ui-monospace,Menlo,Consolas,monospace}
.prompt.open{display:block}
.prompt b{color:var(--brand)}
.actions{display:flex;gap:8px;margin-top:auto}
.actions .btn{margin:0}
.empty{display:none;text-align:center;color:var(--muted);padding:50px 0;font-size:14px}
footer{text-align:center;color:var(--muted);font-size:13px;line-height:1.9;padding:0 16px 30px}
footer a{color:var(--brand);text-decoration:none}
#toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%) translateY(20px);background:#1f2430;color:#fff;padding:10px 20px;border-radius:999px;font-size:14px;opacity:0;pointer-events:none;transition:.25s;z-index:99}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>

</footer>

const PROMPTS = [
// ---------- 写作 ----------
{c:"写作",t:"公众号爆款标题",d:"给一个主题，生成 10 个带悬念、有网感的标题。",p:"你是一位有 10 年经验的新媒体主编。请围绕主题「{{主题}}」，写 10 个公众号标题，要求：15 字以内、带悬念或数字、口语化、不做过度标题党。每个标题后用一句话说明它的吸引点。直接输出列表，不要解释。"},
{c:"写作",t:"文章润色大师",d:"改病句、去啰嗦、修逻辑断点，原意和语气不动。",p:"你是资深文字编辑。请润色下面这段文字：\n{{原文}}\n要求：保留原意和作者语气，只改病句、啰嗦和逻辑断点；改动处用标出，并在文末列出每处修改的理由。不要扩写，不要改变观点。"},
{c:"写作",t:"小说续写",d:"接着你的故事开头往下写，结尾留钩子。",p:"你是一位畅销小说家。请续写下面的故事开头：\n{{开头}}\n要求：保持人物性格和已有伏笔一致，续写约 800 字，结尾留一个钩子让读者想继续看。对话要自然，不要解释性旁白。"},
{c:"写作",t:"中英互译 · 信达雅",d:"翻译要像母语者写的，而不是逐字直译。",p:"你是资深翻译。请把下面这段{{中文/英文}}翻译成{{英文/中文}}：\n{{原文}}\n要求：信、达、雅，符合目标语言母语者的表达习惯；专有名词保留原文或加括号注释；只输出译文，不要解释。"},
// ---------- 绘画 ----------
{c:"绘画",t:"赛博朋克人像",d:"霓虹雨夜东京街头，电影感人像。",p:"Cyberpunk portrait of {{人物描述}}, neon-lit rainy street in Tokyo, glowing signs, cinematic lighting, ultra detailed, 85mm lens, shallow depth of field --ar 3:4 --v 6\n\n适用：Midjourney / 即梦 / 可灵等生图工具，把 {{人物描述}} 换成你想要的人。"},
{c:"绘画",t:"吉卜力动画风",d:"宫崎骏式暖心插画，适合做壁纸和头像。",p:"A heartwarming Studio Ghibli style illustration of {{场景描述}}, lush green fields, soft clouds, hand-painted watercolor texture, warm sunlight, nostalgic atmosphere, high detail --ar 16:9\n\n适用：Midjourney / 即梦等，把 {{场景描述}} 换成你的画面，比如「乡间小站旁等车的小女孩」。"},
{c:"绘画",t:"产品摄影白底图",d:"电商主图级别的产品照，干净、专业。",p:"Professional product photography of {{产品}}, centered on a clean white background, soft studio lighting, subtle shadow, ultra sharp, commercial advertising style, 8k --ar 1:1\n\n适用：Midjourney / 即梦等，把 {{产品}} 换成你的商品，比如「一瓶白色陶瓷香水」。"},
{c:"绘画",t:"扁平风插画",d:"现代杂志风扁平插画，配色大胆干净。",p:"Flat vector illustration of {{主题}}, minimalist, bold geometric shapes, vibrant color palette, clean background, modern editorial style, no text --ar 4:3\n\n适用：Midjourney / 即梦等，把 {{主题}} 换成你要画的内容，比如「一个人在山顶看日出」。"},
// ---------- 编程 ----------
{c:"编程",t:"代码解释员",d:"一段代码看不懂？让它用大白话讲给你听。",p:"你是一位耐心的高级工程师。请用通俗的语言解释下面这段代码：\n{{代码}}\n要求：先一句话说清它在干什么，再分步骤讲关键逻辑，最后指出 1-2 个容易踩的坑。不要复述代码原文。"},
{c:"编程",t:"Debug 侦探",d:"报错了别慌，按这个格式问，原因和修复一次给全。",p:"你是一位 Debug 专家。下面这段代码报错了：\n{{代码}}\n报错信息：{{报错}}\n请按这个格式回答：1. 报错原因（一句话） 2. 最小修复方案（给出改后代码） 3. 为什么会犯这个错 4. 以后怎么避免。"},
{c:"编程",t:"代码评审员",d:"从正确性、性能、可读性、安全性四个维度打分评审。",p:"你是一位严格的代码评审员。请评审下面这段代码：\n{{代码}}\n从正确性、性能、可读性、安全性四个维度打分（每项 10 分），每个维度指出最主要的一个问题并给出修改建议。最后给一个总体评价。"},
{c:"编程",t:"正则表达式生成器",d:"说清楚需求，正则表达式、解释、例子一次给全。",p:"你是一位正则表达式专家。请写一个正则表达式，需求：{{需求，例如：匹配中国大陆手机号}}。\n要求：给出表达式、逐段解释、5 个能匹配的例子和 5 个不能匹配的例子。语言：{{Python/JavaScript}}。"},
// ---------- Agent ----------
{c:"Agent",t:"自主任务 Agent",d:"给 Agent 一个目标，它自己拆解、执行、汇报。",p:"你是一个自主任务执行 Agent。目标：{{目标}}。\n规则：1. 把目标拆成不超过 7 步的子任务；2. 每步执行前说明预期结果，执行后汇报实际结果；3. 遇到不确定的信息先标注[待确认]，不要编造；4. 全部完成后输出一份执行总结。\n收到目标后先输出任务拆解，等我确认再开始执行。"},
{c:"Agent",t:"任务拆解大师",d:"大目标拆成带交付物、耗时和验收标准的清单。",p:"你是任务拆解专家。目标：{{目标}}。\n请把目标拆解成可执行的任务清单：每个任务包含具体动作、交付物、预计耗时和验收标准；按依赖关系排序；标出哪一步最容易卡住以及备选方案。不要讲大道理，只给清单。"},
{c:"Agent",t:"多智能体圆桌会",d:"产品、工程、设计、用户四方坐下来吵一架，再出结论。",p:"请模拟一场多智能体圆桌会，参会角色：产品经理、工程师、设计师、用户代表。讨论主题：{{主题}}。\n要求：每个角色从自己的立场发言，每轮只说最核心的一个观点；三轮后由主持人总结出一个可执行的结论和三个待办事项。"},
{c:"Agent",t:"Agent 自检清单",d:"让 AI 输出前先自己检查一遍，少犯低级错误。",p:"在你完成任何任务后，先不要直接输出结果。按这份清单自检一遍：1. 有没有遗漏用户明确提到的要求？2. 有没有编造无法验证的事实？3. 格式是不是用户要的？4. 有没有更简洁的表达？自检发现问题先修正，再输出最终答案。"},
// ---------- 办公 ----------
{c:"办公",t:"会议纪要整理",d:"啰嗦的会议记录，一键变成标准纪要。",p:"你是高效的会议助理。请把下面的会议记录整理成纪要：\n{{记录}}\n格式：会议主题 / 时间 / 参会人 / 讨论要点（分条）/ 决议事项 / 待办（负责人+截止时间）。没有明确的信息写「待确认」，不要编造。"},
{c:"办公",t:"周报生成器",d:"本周干了啥，300 字以内写得又专业又有结果。",p:"你是职场周报助手。请根据下面这周的工作内容，写一份周报：\n{{工作内容}}\n要求：分「本周完成」「进行中」「下周计划」三部分，每部分用动词开头、带数据结果；语气简洁专业；控制在 300 字以内。"},
{c:"办公",t:"邮件润色",d:"给领导、给客户的邮件，改得体面又重点前置。",p:"请把下面这封邮件改得更得体、更专业：\n{{邮件原文}}\n收件人是{{领导/客户/同事}}，目的是{{目的}}。要求：语气恰当、重点前置、结尾有明确的下一步；只输出改后全文。"},
{c:"办公",t:"PPT 大纲生成",d:"给个主题，出一份有开场、有收尾的演讲大纲。",p:"你是 PPT 专家。请为主题「{{主题}}」生成一份演讲 PPT 大纲，面向{{听众}}，时长约{{时长}}。\n要求：每页一个标题 + 3 个要点；开场要抓人，结尾要有行动号召；标出哪几页需要配图或数据。"},
// ---------- 学习 ----------
{c:"学习",t:"费曼讲解法",d:"再难的概念，也能用生活比喻讲明白。",p:"请用费曼学习法给我讲清楚「{{概念}}」。\n要求：假设我是完全不懂的小白；先用一个生活比喻讲核心思想，再分 3 步讲清楚，最后出 2 道自测题检验我是否真的懂了。"},
{c:"学习",t:"学习计划制定",d:"按天排的学习计划，标出最容易放弃的节点。",p:"你是学习规划师。我要在 {{天数}} 天内学会「{{技能}}」，每天能投入 {{小时数}} 小时，目前水平是{{零基础/有基础}}。\n请制定一份按天排的学习计划：每天学什么、练什么、用什么检验成果；标出最容易放弃的节点和应对方法。"},
{c:"学习",t:"面试模拟官",d:"模拟真实面试，一问一答，结束给评分和短板。",p:"你是{{岗位}}的资深面试官。请模拟一场面试：每次只问一个问题，等我回答后再追问或给反馈；问 5 个问题，覆盖专业能力、项目经验和临场应变；结束时给我的整体表现打分，并指出最大的两个短板。"},
{c:"学习",t:"论文思路梳理",d:"不替你写正文，只帮你把论点和结构理清楚。",p:"你是学术写作助手。我的论文题目是「{{题目}}」，研究问题是{{问题}}。\n请帮我梳理：1. 核心论点（一句话） 2. 论证结构（分 3-4 个部分，每部分一句话） 3. 可能被质疑的两个点及回应思路。不要替我写正文。"},
// ---------- 通用 ----------
{c:"通用",t:"苏格拉底提问者",d:"不反驳你，只提问，帮你发现自己观点里的漏洞。",p:"你是苏格拉底式的提问者。我的观点是：{{观点}}。\n请不要直接反驳或赞同，而是连续向我提 5 个层层深入的问题，帮我发现自己观点里的漏洞和假设。每次只问一个问题，等我回答再问下一个。"},
{c:"通用",t:"万能提问优化器",d:"把你随手写的问题，改写成 AI 最好回答的样子。",p:"请把我下面这个问题改写成一个更好的 AI 提问：\n{{我的问题}}\n要求：补全背景信息、明确我想要的输出格式、拆掉模糊表述；输出改写后的提问，并用一句话说明你改了哪里、为什么。"},
{c:"通用",t:"辩论对手",d:"找个不让步的对手，三轮辩论，找出你最薄弱的一环。",p:"你来当我的辩论对手。辩题：{{辩题}}，我方立场：{{立场}}。\n要求：你站在反方，每轮提出一个最有力的反驳；我回应后你再继续，不要让步；三轮后总结双方最强的论点和我方最薄弱的一环。"},
{c:"通用",t:"决策分析助手",d:"从成本、收益、风险、可逆性四个维度对比，再给推荐。",p:"请帮我做一个决策分析。决策事项：{{事项}}，选项有：{{选项A / 选项B / 选项C}}。\n请从成本、收益、风险、可逆性四个维度对比每个选项；最后给出你的推荐及理由，并说明在什么情况下应该改变选择。"},
];
let activeCat = "全部";
let query = "";
function esc(s){return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}
function renderCats(){
  const counts = {};
  PROMPTS.forEach(x=>counts[x.c]=(counts[x.c]||0)+1);
  let h = '<button class="'+(activeCat==="全部"?"on":"")+'" onclick="setCat(\'全部\')">全部 <span class="n">'+PROMPTS.length+'</span></button>';
  CATS.forEach(c=>{ h += '<button class="'+(activeCat===c?"on":"")+'" onclick="setCat(\''+c+'\')">'+c+' <span class="n">'+(counts[c]||0)+'</span></button>'; });
  document.getElementById("cats").innerHTML = h;
}
function setCat(c){ activeCat = c; renderCats(); render(); }
function filtered(){
  const q = query.trim().toLowerCase();
  return PROMPTS.filter(x=>{
    if(activeCat!=="全部" && x.c!==activeCat) return false;
    if(!q) return true;
    return (x.t+x.d+x.p+x.c).toLowerCase().includes(q);
  });
}
function render(){
  const list = filtered();
  document.getElementById("total").textContent = list.length;
  document.getElementById("empty").style.display = list.length ? "none" : "block";
  const grid = document.getElementById("grid");
  grid.innerHTML = list.map((x,i)=>{
    const ci = PROMPTS.indexOf(x);
    const col = COLORS[x.c].split("|");
    const body = esc(x.p).replace(/\{\{[^}]+\}\}/g, m=>"<b>"+m+"</b>");
    return '<div class="card" id="card-'+ci+'">'
      + '<span class="tag" style="background:'+col[0]+';color:'+col[1]+'">'+x.c+'</span>'
      + '<h3>'+esc(x.t)+'</h3>'
      + '<p class="desc">'+esc(x.d)+'</p>'
      + '<div class="prompt" id="prompt-'+ci+'">'+body+'</div>'
      + '<div class="actions">'
      + '<button class="btn" onclick="copyPrompt('+ci+',this)">📋 复制提示词</button>'
      + '<button class="btn ghost" onclick="togglePrompt('+ci+',this)">👁 查看全文</button>'
      + '</div></div>';
  }).join("");
}
function togglePrompt(i,btn){
  const el = document.getElementById("prompt-"+i);
  const open = el.classList.toggle("open");
  btn.textContent = open ? "🔼 收起" : "👁 查看全文";
}
function copyText(t, ok){
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(t).then(ok).catch(()=>fallbackCopy(t,ok));
  } else fallbackCopy(t,ok);
}
function fallbackCopy(t, ok){
  const ta = document.createElement("textarea");
  ta.value = t; ta.style.position = "fixed"; ta.style.opacity = "0";
  document.body.appendChild(ta); ta.select();
  try{ document.execCommand("copy"); ok(); }catch(e){ toast("复制失败，请手动选择复制"); }
  document.body.removeChild(ta);
}
function copyPrompt(i,btn){
  const el = document.getElementById("prompt-"+i);
  if(!el.classList.contains("open")){ el.classList.add("open"); }
  copyText(PROMPTS[i].p, ()=>{ toast("✅ 已复制："+PROMPTS[i].t); });
}
function randomOne(){
  const list = filtered();
  if(!list.length) return;
  const pick = list[Math.floor(Math.random()*list.length)];
  const ci = PROMPTS.indexOf(pick);
  const card = document.getElementById("card-"+ci);
  if(!card) return;
  card.scrollIntoView({behavior:"smooth",block:"center"});
  card.classList.add("flash");
  const el = document.getElementById("prompt-"+ci);
  el.classList.add("open");
  setTimeout(()=>card.classList.remove("flash"), 1600);
  toast("🎲 随机推荐："+pick.t);
}
let toastTimer = null;
function toast(msg){
  const el = document.getElementById("toast");
  el.textContent = msg; el.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>el.classList.remove("show"), 2200);
}
document.getElementById("q").addEventListener("input", e=>{ query = e.target.value; render(); });
renderCats();
render();
</script>
